name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

#[[d1_databases]]
#binding = "db"			#d1
#database_name = ""		#d1
#database_id = ""		#d1id

#[[kv_namespaces]]
#binding = "kv"			#kv
#id = ""						#kv

#[[r2_buckets]]
#binding = "r2"			#r2
#bucket_name = ""		#r2

#[[send_email]]
#name = "email"			#CF send mail, config after first use

# ...



[ai]
binding = "ai"

[assets]
binding = "assets"		#assets binding name
directory = "./dist"	#dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#crons


[vars]
#ai_model = ""			#ai model,default @cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#enable analysis cache
#orm_log = false			#enable orm log
#domain = []				#email domain
#admin = ""					#admin email
#jwt_secret = ""			#jwt secret key

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
